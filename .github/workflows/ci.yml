name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  uv-version: "0.13.9"

jobs:
  test:
    strategy:
      matrix:
        platform:
          # Compile against oldest available Ubuntu to get an older glibc
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          args: -o dist/ -i python${{ matrix.python }}
          sccache: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.uv-version }}
          enable-cache: true
          cache-suffix: test
      - name: Install dependencies
        run: uv sync --locked --only-group nox
      - name: Test
        run: |
          uv run --no-sync nox -s test-${{ matrix.python }} -- --use-dist
      - name: Test Polars
        run: |
          uv run --no-sync nox -s test_polars-${{ matrix.python }} -- --use-dist
      - name: Test Pandas
        run: |
          uv run --no-sync nox -s test_pandas-${{ matrix.python }} -- --use-dist
      - name: Store coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-${{ matrix.platform }}-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Fetch coverage
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.uv-version }}
          enable-cache: true
          cache-suffix: coverage
      - name: Install dependencies
        run: uv sync --locked --only-group nox
      - name: Combine coverage and generate report
        run: uv run --no-sync nox -s coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.uv-version }}
          enable-cache: true
          cache-suffix: lint
      - name: Install dependencies
        run: uv sync --locked --only-group nox
      - name: Run code quality checks
        run: uv run --no-sync nox -s lint

  actions-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Verify GitHub Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.1
          gh actions-lock --verify
